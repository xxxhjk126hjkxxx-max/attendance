<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142B45">
<title>Reset password · University Attendance</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div class="auth" style="grid-template-columns:1fr;place-items:center;min-height:100vh">
  <main class="auth-main">
    <form class="auth-card" id="reset-form" novalidate>
      <div class="seal" aria-hidden="true">IUA</div>
      <h2>Set a new password</h2>
      <p class="sub">Choose a strong password for your administrator account.</p>
      <div class="auth-alert" id="reset-alert" role="alert" style="display:none"></div>
      <div class="form-field" data-field="password" style="margin-bottom:14px">
        <label for="reset-password">New password</label>
        <input id="reset-password" name="password" class="field" type="password" autocomplete="new-password" minlength="12" required>
        <span class="hint">Minimum 12 characters with mixed letters, digits or symbols.</span>
        <span class="error"></span>
      </div>
      <div class="form-field" data-field="confirm" style="margin-bottom:16px">
        <label for="reset-confirm">Confirm password</label>
        <input id="reset-confirm" name="confirm" class="field" type="password" autocomplete="new-password" required>
        <span class="error"></span>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Update password</button>
      <p class="auth-hint"><a href="/">Return to sign-in</a></p>
    </form>
  </main>
</div>
<script src="/assets/js/core.js" defer></script>
<script nonce="__CSP_NONCE__" defer>
  window.APP_VERSION = '__APP_VERSION__';
  document.addEventListener('DOMContentLoaded', () => {
    App.i18n.setLang(document.documentElement.lang || 'en');
    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('reset-alert');
    const token = new URLSearchParams(location.search).get('token') || '';
    if (!token) {
      alertBox.textContent = 'This reset link is missing its token. Request a new link from the sign-in page.';
      alertBox.style.display = 'flex';
      form.querySelector('button[type=submit]').disabled = true;
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = form.querySelector('#reset-password').value;
      const confirm = form.querySelector('#reset-confirm').value;
      alertBox.style.display = 'none';
      if (password !== confirm) {
        alertBox.textContent = 'Passwords do not match.';
        alertBox.style.display = 'flex';
        return;
      }
      const submit = form.querySelector('button[type=submit]');
      App.busy(submit, true);
      try {
        await App.api.post('/api/auth/reset-password', { token, newPassword: password });
        alertBox.className = 'auth-alert ok';
        alertBox.textContent = 'Password updated. Redirecting to sign-in…';
        alertBox.style.display = 'flex';
        setTimeout(() => { location.href = '/'; }, 1600);
      } catch (error) {
        alertBox.className = 'auth-alert';
        alertBox.textContent = error.message;
        alertBox.style.display = 'flex';
      } finally {
        App.busy(submit, false);
      }
    });
  });
</script>
</body>
</html>
