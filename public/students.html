<style>

eight:700;transition:.15s}.btn:hover{background:#f5f7f9}.btn.primary{background:var(--navy);border-color:var(--navy);color:white}.btn.primary:hover{background:#203e5e}.btn.gold{background:var(--gold);border-color:var(--gold);color:white}.btn.danger{color:var(--red)}.btn:disabled{opacity:.55;cursor:wait}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:start;padding:11px 12px;font-size:11px;border-bottom:1px solid #edf0f3}th{background:#f6f8fa;color:var(--muted);font-size:10px}tbody tr:hover{background:#fafcfd}.row-actions{display:flex;gap:5px}.row-actions .btn{min-height:30px;padding:4px 8px;font-size:10px}.muted{color:var(--muted)}.status{min-height:22px;margin:10px 0;color:var(--muted);font-size:11px}.status.error{color:var(--red)}.status.success{color:var(--green)}.pagination{display:flex;align-items:center;justify-content:space-between;padding-top:13px;font-size:11px;color:var(--muted)}.pagination .controls{display:flex;align-items:center;gap:8px}dialog{width:min(720px,calc(100% - 24px));max-height:90vh;overflow:auto;border:0;border-radius:15px;padding:0;box-shadow:0 22px 70px #07162644;color:var(--ink)}dialog::backdrop{background:#0b1c2a88;backdrop-filter:blur(2px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:1}.dialog-head h2{font-size:16px;margin:0;color:var(--navy)}.dialog-body{padding:18px 20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{display:grid;gap:5px;font-size:11px;font-weight:700}.form-grid label.full{grid-column:1/-1}.form-grid .field{width:100%}.field-error{font-size:10px;color:var(--red);font-weight:500;min-height:15px}.dialog-actions{display:flex;justify-content:flex-start;gap:8px;padding:0 20px 18px}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.profile-cell{background:#f6f8fa;border-radius:8px;padding:10px}.profile-cell small{display:block;color:var(--muted);font-size:9px}.profile-cell b{font-size:12px}.history-title{font-size:13px;color:var(--navy)}.history{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:8px}.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#10253b,#315b83);display:grid;place-items:center;padding:18px;z-index:5}.login-box{width:min(400px,100%);background:#fff;border-radius:15px;padding:28px;border-top:4px solid var(--gold);box-shadow:0 20px 60px #06192d55}.login-box h1{font-size:20px;text-align:center;color:var(--navy)}.login-box p{text-align:center;color:var(--muted);font-size:11px}.login-box label{display:block;font-size:11px;margin:12px 0 5px}.login-box .field,.login-box .btn{width:100%}.login-box .btn{margin-top:13px}.toast{position:fixed;bottom:18px;left:18px;background:var(--navy);color:white;border-radius:8px;padding:11px 15px;z-index:10;font-size:11px}.loader{display:inline-flex;align-items:center;gap:8px}.loader:before{content:'';width:13px;height:13px;border:2px solid #dce5eb;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.qr-modal{width:min(1000px,calc(100% - 24px))}.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.qr-card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;break-inside:avoid}.qr-code{display:grid;place-items:center;min-height:132px;margin:5px auto 8px}.qr-card b,.qr-card small{display:block}.qr-card small{color:var(--muted);font-size:10px;margin:3px 0 8px}.qr-card .btn{margin:3px 2px;min-height:30px;padding:5px 8px;font-size:10px}.revoked{color:var(--red);font-size:11px;padding:18px}.qr-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}@media(max-width:650px){.top{height:60px;padding:0 13px}.wrap{padding:20px 12px}.heading{align-items:fle <body>
<section id="loginScreen" class="login-screen"><form id="loginForm" class="login-box"><div class="seal" style="margin:auto">IUA</div><h1 data-ar="دخول مسؤول إدارة الطلاب" data-en="Student management sign in">دخول مسؤول إدارة الطلاب</h1><p data-ar="استخدم حساب المسؤول المُعد على الخادم" data-en="Use the administrator account configured on the server">استخدم حساب المسؤول المُعد على الخادم</p><label for="email" data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label><input id="email" class="field" type="email" autocomplete="username" required><label for="password" data-ar="كلمة المرور" data-en="Password">كلمة المرور</label><input id="password" class="field" type="password" autocomplete="current-password" required><div id="loginError" class="status error" role="alert"></div><button id="loginButton" class="btn primary" type="submit" data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</button></form></section>
<header class="top"><a class="brand" href="/"><span class="seal">IUA</span><span data-ar="بوابة الجامعة" data-en="University Portal">بوابة الجامعة</span></a><div class="top-actions"><a href="/" data-ar="لوحة الحضور" data-en="Attendance dashboard">لوحة الحضور</a><button id="langButton" class="btn" type="button">English</button><button id="logout" class="btn" type="button" data-ar="خروج" data-en="Sign out">خروج</button></div></header>
<main class="wrap"><div class="heading"><div><div class="eyebrow" data-ar="الإدارة الأكاديمية" data-en="ACADEMIC ADMINISTRATION">الإدارة الأكاديمية</div><h1 data-ar="إدارة الطلاب" data-en="Student management">إدارة الطلاب</h1><p data-ar="إضافة وتحديث ملفات الطلاب واستعراض سجل الحضور." data-en="Create and update student profiles and review attendance history.">إضافة وتحديث ملفات الطلاب واستعراض سجل الحضور.</p></div><button id="addButton" class="btn primary" type="button" data-ar="＋ إضافة طالب" data-en="＋ Add student">＋ إضافة طالب</button></div>
<section class="panel"><div class="toolbar"><input id="search" class="field search" type="search" data-ar-placeholder="ابحث بالاسم أو الرقم الجامعي" data-en-placeholder="Search name or student ID" placeholder="ابحث بالاسم أو الرقم الجامعي"><select id="courseFilter" class="field" aria-label="Course filter"><option value="" data-ar="كل المقررات" data-en="All courses">كل المقررات</option></select><select id="levelFilter" class="field" aria-label="Academic level filter"><option value="" data-ar="كل المستويات" data-en="All levels">كل المستويات</option></select><button id="resetButton" class="btn" type="button" data-ar="إعادة ضبط" data-en="Reset">إعادة ضبط</button><button id="bulkQr" class="btn gold" type="button" data-ar="بطاقات QR لكل الطلاب" data-en="QR cards for all students">بطاقات QR لكل الطلاب</button></div><div id="status" class="status" role="status" aria-live="polite"></div><div class="tablebox"><table><thead><tr><th data-ar="الرقم الجامعي" data-en="Student ID">الرقم الجامعي</th><th data-ar="اسم الطالب" data-en="Student name">اسم الطالب</th><th data-ar="المقرر" data-en="Course">المقرر</th><th data-ar="المستوى الدراسي" data-en="Academic level">المستوى الدراسي</th><th data-ar="الإجراءات" data-en="Actions">الإجراءات</th></tr></thead><tbody id="studentRows"></tbody></table></div><div class="pagination"><span id="pageInfo"></span><div class="controls"><button id="previous" class="btn" type="button">‹</button><span id="pageNumber"></span><button id="next" class="btn" type="button">›</button></div></div></section></main>
<dialog id="studentDialog"><form id="studentForm"><div class="dialog-head"><h2 id="formTitle"></h2><button class="btn" type="button" data-close="studentDialog" aria-label="Close">×</button></div><div class="dialog-body"><div class="form-grid"><label><span data-ar="الرقم الجامعي" data-en="Student ID">الرقم الجامعي</span><input id="studentId" class="field" maxlength="40" required><small id="idError" class="field-error"></small></label><label><span data-ar="اسم الطالب" data-en="Student name">اسم الطالب</span><input id="studentName" class="field" maxlength="100" required><small id="nameError" class="field-error"></small></label><label><span data-ar="المقرر الدراسي" data-en="Course">المقرر الدراسي</span><input id="studentCourse" class="field" maxlength="100" required><small id="courseError" class="field-error"></small></label><label><span data-ar="المستوى الدراسي" data-en="Academic level">المستوى الدراسي</span><input id="studentLevel" class="field" maxlength="60" required placeholder="مثال: السنة الثانية"><small id="levelError" class="field-error"></small></label></div></div><div class="dialog-actions"><button id="saveStudent" class="btn primary" type="submit"></button><button class="btn" type="button" data-close="studentDialog" data-ar="إلغاء" data-en="Cancel">إلغاء</button></div></form></dialog>
<dialog id="profileDialog"><div class="dialog-head"><h2 id="profileTitle"></h2><button class="btn" type="button" data-close="profileDialog" aria-label="Close">×</button></div><div class="dialog-body"><div id="profileDetails" class="profile-grid"></div><h3 class="history-title" data-ar="سجل الحضور" data-en="Attendance history">سجل الحضور</h3><div id="historyStatus" class="status" role="status"></div><div class="history"><table><thead><tr><th data-ar="التاريخ والوقت" data-en="Date and time">التاريخ والوقت</th><th data-ar="المقرر" data-en="Course">المقرر</th><th data-ar="الحالة" data-en="Status">الحالة</th></tr></thead><tbody id="historyRows"></tbody></table></div></div><div class="dialog-actions"><button class="btn" type="button" data-close="profileDialog" data-ar="إغلاق" data-en="Close">إغلاق</button></div></dialog>
<dialog id="qrDialog" class="qr-modal"><div class="dialog-head"><h2 id="qrTitle" data-ar="بطاقة رمز الطالب" data-en="Student QR card">بطاقة رمز الطالب</h2><button class="btn no-print" type="button" data-close="qrDialog" aria-label="Close">×</button></div><div class="dialog-body"><div id="qrTools" class="qr-toolbar no-print"><button id="printQr" class="btn primary" type="button" data-ar="طباعة البطاقات" data-en="Print cards">طباعة البطاقات</button></div><div id="qrCards" class="qr-grid"></div><div id="qrStatus" class="status" role="status" aria-live="polite"></div></div></dialog>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('iua-admin-token')||'',lang='ar',page=1,totalPages=1,editingId=null,searchTimer=null,qrCards=[];const pageSize=10;
function t(ar,en){return lang==='ar'?ar:en}function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar][data-en]').forEach(el=>{el.textContent=t(el.dataset.ar,el.dataset.en)});document.querySelectorAll('[data-ar-placeholder]').forEach(el=>el.placeholder=t(el.dataset.arPlaceholder,el.dataset.enPlaceholder));$('langButton').textContent=lang==='ar'?'English':'العربية';$('previous').setAttribute('aria-label',t('الصفحة السابقة','Previous page'));$('next').setAttribute('aria-label',t('الصفحة التالية','Next page'));if(editingId!==null)$('formTitle').textContent=t('تعديل بيانات الطالب','Edit student');else $('formTitle').textContent=t('إضافة طالب جديد','Add a student');$('saveStudent').textContent=t('حفظ بيانات الطالب','Save student');}
function showStatus(message,type=''){const el=$('status');el.textContent=message;el.className='status'+(type?' '+type:'')}function toast(message){const el=$('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(el.timer);el.timer=setTimeout(()=>el.classList.add('hidden'),2500)}
async function api(url,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;const response=await fetch(url,{...options,headers});const data=await response.json().catch(()=>({error:'Invalid server response.'}));if(response.status===401){token='';sessionStorage.removeItem('iua-admin-token');showLogin();throw new Error(data.error||t('انتهت الجلسة. سجل الدخول مجدداً.','Session expired. Please sign in again.'))}if(!response.ok){const error=new Error(data.error||t('تعذر تنفيذ الطلب.','Request failed.'));error.fields=data.fields||{};error.status=response.status;throw error}return data}
function showLogin(){$('loginScreen').classList.remove('hidden')}function showApp(){$('loginScreen').classList.add('hidden')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('loginButton');button.disabled=true;button.textContent=t('جارٍ التحقق…','Signing in…');$('loginError').textContent='';try{const result=await api('/api/auth/login',{method:'POST',headers:{},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=result.token;sessionStorage.setItem('iua-admin-token',token);showApp();page=1;await loadStudents()}catch(error){$('loginError').textContent=error.message}finally{button.disabled=false;button.textContent=t('تسجيل الدخول','Sign in')}});$('logout').addEventListener('click',()=>{token='';sessionStorage.removeItem('iua-admin-token');showLogin()});$('langButton').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';translate();loadStudents()});
function setBusy(value){$('previous').disabled=value||page<=1;$('next').disabled=value||page>=totalPages}
async function loadStudents(){if(!token)return;setBusy(true);showStatus(t('جارٍ تحميل الطلاب…','Loading students…'));$('studentRows').innerHTML=`<tr><td class="empty" colspan="5"><span class="loader">${t('جارٍ التحميل','Loading')}</span></td></tr>`;try{const params=new URLSearchParams({page:String(page),pageSize:String(pageSize),search:$('search').value.trim(),course:$('courseFilter').value,level:$('levelFilter').value});const result=await api('/api/students?'+params);totalPages=result.totalPages;page=result.page;renderRows(result.items);renderOptions(result.courses,result.levels);$('pageInfo').textContent=t(`عدد الطلاب: ${result.total}`,`Students: ${result.total}`);$('pageNumber').textContent=t(`صفحة ${page} من ${totalPages}`,`Page ${page} of ${totalPages}`);showStatus(result.total?t('تم تحميل البيانات','Students loaded'):'',result.total?'success':'')}catch(error){showStatus(error.message,'error');$('studentRows').innerHTML=`<tr><td class="empty" colspan="5">${escapeHtml(error.message)}</td></tr>`}finally{setBusy(false)}}
function renderOptions(courses,levels){const keepCourse=$('courseFilter').value,keepLevel=$('levelFilter').value,option=(value,label)=>`<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`;$('courseFilter').innerHTML=option('',t('كل المقررات','All courses'))+courses.map(v=>option(v,v)).join('');$('levelFilter').innerHTML=option('',t('كل المستويات','All levels'))+levels.map(v=>option(v,v)).join('');$('courseFilter').value=courses.includes(keepCourse)?keepCourse:'';$('levelFilter').value=levels.includes(keepLevel)?keepLevel:''}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderRows(items){if(!items.length){$('studentRows').innerHTML=`<tr><td class="empty" colspan="5">${t('لا يوجد طلاب مطابقون لمعايير البحث.','No students match these filters.')}</td></tr>`;return}$('studentRows').innerHTML=items.map(s=>`<tr><td>${escapeHtml(s.id)}</td><td><button class="btn" type="button" data-profile="${escapeHtml(s.id)}">${escapeHtml(s.name)}</button></td><td>${escapeHtml(s.course)}</td><td>${escapeHtml(s.level)}</td><td><div class="row-actions"><button class="btn" type="button" data-qr="${escapeHtml(s.id)}">QR</button><button class="btn" type="button" data-edit="${escapeHtml(s.id)}">${t('تعديل','Edit')}</button><button class="btn danger" type="button" data-delete="${escapeHtml(s.id)}">${t('حذف','Delete')}</button></div></td></tr>`).join('')}
$('studentRows').addEventListener('click',async e=>{const profile=e.target.closest('[data-profile]'),edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),qr=e.target.closest('[data-qr]');if(profile)await openProfile(profile.dataset.profile);if(edit)await openEdit(edit.dataset.edit);if(del)await deleteStudent(del.dataset.delete);if(qr)await showQrForStudent(qr.dataset.qr)});
function clearErrors(){['idError','nameError','courseError','levelError'].forEach(id=>$(id).textContent='')}function openAdd(){editingId=null;$('studentForm').reset();clearErrors();translate();$('studentId').disabled=false;$('studentDialog').showModal();$('studentId').focus()}
async function openEdit(id){try{showStatus(t('جارٍ تحميل ملف الطالب…','Loading student profile…'));const {item}=await api('/api/students/'+encodeURIComponent(id));editingId=id;$('studentForm').reset();clearErrors();$('studentId').value=item.id;$('studentId').disabled=true;$('studentName').value=item.name;$('studentCourse').value=item.course;$('studentLevel').value=item.level;translate();$('studentDialog').showModal();showStatus('')}catch(error){showStatus(error.message,'error')}}$('addButton').addEventListener('click',openAdd);
$('studentForm').addEventListener('submit',async e=>{e.preventDefault();clearErrors();const button=$('saveStudent');button.disabled=true;button.textContent=t('جارٍ الحفظ…','Saving…');const body={id:$('studentId').value.trim(),name:$('studentName').value.trim(),course:$('studentCourse').value.trim(),level:$('studentLevel').value.trim()};if(!body.name||body.name.length>100||!body.course||body.course.length>100||!body.level||body.level.length>60||(!editingId&&!/^[\p{L}\p{N}._/-]{1,40}$/u.test(body.id))){if(!editingId&&!/^[\p{L}\p{N}._/-]{1,40}$/u.test(body.id))$('idError').textContent=t('أدخل رقماً صالحاً حتى 40 حرفاً أو رقماً.','Enter a valid ID (up to 40 letters or numbers).');if(!body.name||body.name.length>100)$('nameError').textContent=t('الاسم مطلوب وبحد أقصى 100 حرف.','Name is required (max 100 characters).');if(!body.course||body.course.length>100)$('courseError').textContent=t('المقرر مطلوب وبحد أقصى 100 حرف.','Course is required (max 100 characters).');if(!body.level||body.level.length>60)$('levelError').textContent=t('المستوى مطلوب وبحد أقصى 60 حرفاً.','Academic level is required (max 60 characters).');button.disabled=false;translate();return}try{if(editingId)await api('/api/students/'+encodeURIComponent(editingId),{method:'PUT',body:JSON.stringify(body)});else await api('/api/students',{method:'POST',body:JSON.stringify(body)});$('studentDialog').close();showStatus(t('تم حفظ بيانات الطالب بنجاح.','Student saved successfully.'),'success');toast(t('تم حفظ بيانات الطالب','Student saved'));await loadStudents()}catch(error){if(error.fields){if(error.fields.id)$('idError').textContent=t('الرقم الجامعي مستخدم أو غير صالح.','Student ID is duplicate or invalid.');if(error.fields.name)$('nameError').textContent=error.fields.name;if(error.fields.course)$('courseError').textContent=error.fields.course;if(error.fields.level)$('levelError').textContent=error.fields.level}else showStatus(error.message,'error')}finally{button.disabled=false;button.textContent=t('حفظ بيانات الطالب','Save student')}});
async function deleteStudent(id){if(!confirm(t(`هل أنت متأكد من حذف الطالب ${id}؟ سيبقى سجل الحضور محفوظاً.`,`Delete student ${id}? Attendance history will be retained.`)))return;try{await api('/api/students/'+encodeURIComponent(id),{method:'DELETE'});showStatus(t('تم حذف الطالب.','Student deleted.'),'success');toast(t('تم حذف الطالب','Student deleted'));await loadStudents()}catch(error){showStatus(error.message,'error')}}
async function openProfile(id){$('profileTitle').textContent=t('ملف الطالب','Student profile')+' · '+id;$('profileDetails').innerHTML='';$('historyRows').innerHTML=`<tr><td colspan="3" class="empty">${t('جارٍ تحميل سجل الحضور…','Loading attendance history…')}</td></tr>`;$('historyStatus').textContent='';$('profileDialog').showModal();try{const data=await api('/api/students/'+encodeURIComponent(id)+'/attendance'),s=data.student;$('profileTitle').textContent=s.name+' · '+s.id;$('profileDetails').innerHTML=[[t('الرقم الجامعي','Student ID'),s.id],[t('الاسم','Name'),s.name],[t('المقرر','Course'),s.course],[t('المستوى الدراسي','Academic level'),s.level]].map(([k,v])=>`<div class="profile-cell"><small>${escapeHtml(k)}</small><b>${escapeHtml(v)}</b></div>`).join('');$('historyRows').innerHTML=data.history.length?data.history.map(r=>`<tr><td>${new Date(r.attendedAt).toLocaleString(lang==='ar'?'ar':'en-GB')}</td><td>${escapeHtml(r.course||'—')}</td><td>${escapeHtml(r.status)}</td></tr>`).join(''):`<tr><td colspan="3" class="empty">${t('لا يوجد سجل حضور لهذا الطالب بعد.','No attendance history for this student yet.')}</td></tr>`}catch(error){$('historyStatus').textContent=error.message;$('historyStatus').className='status error';$('historyRows').innerHTML=''}}
function makeCardMarkup(student,index){const revoked=!!student.revokedAt;return `<article class="qr-card" data-card-index="${index}"><div class="qr-code" id="qrCode${index}">${revoked?`<span class="revoked">${t('رمز ملغى','Revoked QR')}</span>`:''}</div><b>${escapeHtml(student.name)}</b><small>${escapeHtml(student.id)} · ${escapeHtml(student.course||'')}</small>${revoked?'':`<button class="btn" type="button" data-download="${index}">${t('تنزيل البطاقة','Download card')}</button><button class="btn" type="button" data-rotate="${index}">${t('تجديد الرمز','Rotate QR')}</button><button class="btn danger" type="button" data-revoke="${index}">${t('إلغاء الرمز','Revoke QR')}</button>`}</article>`}
function drawQrCards(items){qrCards=items;$('qrCards').innerHTML=items.length?items.map(makeCardMarkup).join(''):`<p class="empty">${t('لا يوجد طلاب لإنشاء بطاقات.','No students available for QR cards.')}</p>`;items.forEach((s,i)=>{if(s.token&&!s.revokedAt){const el=$('qrCode'+i);if(el&&window.QRCode)new QRCode(el,{text:JSON.stringify({v:1,token:s.token}),width:118,height:118,correctLevel:QRCode.CorrectLevel.Q})}});$('qrStatus').textContent=items.length?t(`${items.length} بطاقة — لا تحتوي رموز QR على بيانات شخصية.` ,`${items.length} cards — QR payloads contain no personal information.`):''}
async function showQrForStudent(id){$('qrDialog').showModal();$('qrCards').innerHTML=`<p class="empty">${t('جارٍ إنشاء رمز آمن…','Creating secure QR code…')}</p>`;try{const {item}=await api('/api/students/'+encodeURIComponent(id)+'/qr');drawQrCards([item])}catch(error){$('qrCards').innerHTML='';$('qrStatus').textContent=error.message;$('qrStatus').className='status error'}}
$('bulkQr').addEventListener('click',async()=>{$('qrDialog').showModal();$('qrCards').innerHTML=`<p class="empty"><span class="loader">${t('جارٍ إنشاء البطاقات…','Generating cards…')}</span></p>`;try{const {items}=await api('/api/students/qr-cards');drawQrCards(items)}catch(error){$('qrCards').innerHTML='';$('qrStatus').textContent=error.message;$('qrStatus').className='status error'}});
function canvasForCard(index){const el=$('qrCode'+index);return el?.querySelector('canvas')||null}function downloadCard(index){const card=document.querySelector(`[data-card-index="${index}"]`),canvas=canvasForCard(index);if(!card||!canvas){toast(t('لا يمكن تنزيل بطاقة ملغاة.','Revoked cards cannot be downloaded.'));return}const out=document.createElement('canvas'),ctx=out.getContext('2d');out.width=520;out.height=340;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,out.width,out.height);ctx.strokeStyle='#C5A15B';ctx.lineWidth=5;ctx.strokeRect(12,12,496,316);ctx.fillStyle='#142B45';ctx.textAlign='center';ctx.font='bold 22px Cairo, sans-serif';ctx.fillText('IUA · '+t('بطاقة الطالب','Student card'),260,48);ctx.drawImage(canvas,202,67,116,116);const student=qrCards[index];ctx.font='bold 20px Cairo, sans-serif';ctx.fillText(student.name,260,222);ctx.font='16px Cairo, sans-serif';ctx.fillText(student.id,260,250);ctx.font='14px Cairo, sans-serif';ctx.fillStyle='#758596';ctx.fillText(student.course||'',260,278);const a=document.createElement('a');a.download=`student-${student.id}-qr.png`;a.href=out.toDataURL('image/png');a.click()}
$('qrCards').addEventListener('click',async e=>{const download=e.target.closest('[data-download]'),revoke=e.target.closest('[data-revoke]'),rotate=e.target.closest('[data-rotate]');if(download){downloadCard(Number(download.dataset.download));return}const index=Number((revoke||rotate)?.dataset[revoke?'revoke':'rotate']);if(!revoke&&!rotate)return;const student=qrCards[index];if(revoke){if(!confirm(t(`إلغاء رمز QR للطالب ${student.id}؟ لن يعمل بعد ذلك.`,`Revoke QR for ${student.id}? It will stop working immediately.`)))return;try{await api('/api/students/'+encodeURIComponent(student.id)+'/qr/revoke',{method:'POST'});student.token=null;student.revokedAt=new Date().toISOString();drawQrCards(qrCards);toast(t('تم إلغاء الرمز.','QR revoked.'))}catch(error){$('qrStatus').textContent=error.message;$('qrStatus').className='status error'}}else{if(!confirm(t(`إنشاء رمز جديد؟ سيتوقف الرمز السابق للطالب ${student.id} عن العمل.`,`Generate a new QR? The previous code for ${student.id} will stop working.`)))return;try{const result=await api('/api/students/'+encodeURIComponent(student.id)+'/qr/rotate',{method:'POST'});student.token=result.item.qr.token;student.revokedAt=null;drawQrCards(qrCards);toast(t('تم تجديد الرمز.','QR rotated.'))}catch(error){$('qrStatus').textContent=error.message;$('qrStatus').className='status error'}}});
$('printQr').addEventListener('click',()=>window.print());$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadStudents()},250)});$('courseFilter').addEventListener('change',()=>{page=1;loadStudents()});$('levelFilter').addEventListener('change',()=>{page=1;loadStudents()});$('resetButton').addEventListener('click',()=>{$('search').value='';$('courseFilter').value='';$('levelFilter').value='';page=1;loadStudents()});$('previous').addEventListener('click',()=>{if(page>1){page--;loadStudents()}});$('next').addEventListener('click',()=>{if(page<totalPages){page++;loadStudents()}});document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>$(button.dataset.close).close()));document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()}));$('langButton').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';translate();if(token)loadStudents()});translate();if(token){showApp();loadStudents()}else showLogin();
</script></body></html>
